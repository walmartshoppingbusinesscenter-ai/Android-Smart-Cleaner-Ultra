
name: Build Android Smart Cleaner Pro APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o AndroidSmartCleanerPro-MVP.zip -d extracted
          test -f extracted/AndroidSmartCleanerPro/settings.gradle.kts
      
      - name: Fix Persian XML resources
        run: |
          cat > extracted/AndroidSmartCleanerPro/app/src/main/res/values-fa/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">پاک‌ساز هوشمند پرو</string>
              <string name="app_title">پاک‌ساز هوشمند پرو</string>
              <string name="subtitle">گوشی شما، مرتب‌تر و ساده‌تر</string>
              <string name="storage_title">نمای کلی حافظه</string>
              <string name="used">استفاده‌شده</string>
              <string name="free">در دسترس</string>
              <string name="total">کل</string>
              <string name="quick_actions">دسترسی سریع</string>
              <string name="large_files">فایل‌های حجیم</string>
              <string name="duplicates">فایل‌های تکراری</string>
              <string name="device_info">اطلاعات دستگاه</string>
              <string name="settings">ظاهر و زبان</string>
              <string name="dark_mode">حالت تیره</string>
              <string name="language">زبان</string>
              <string name="english">English</string>
              <string name="persian">فارسی</string>
              <string name="scan">بررسی حافظه</string>
              <string name="scan_note">اسکن فایل‌ها در مرحله بعد اضافه می‌شود. این نسخه هیچ فایلی را حذف نمی‌کند.</string>
              <string name="storage_note">مقادیر حافظه توسط اندروید ارائه می‌شوند و ممکن است فضای رزروشده سیستم را نیز شامل شوند.</string>
              <string name="gb">گیگابایت</string>
          </resources>
          EOF
          
          cat > extracted/AndroidSmartCleanerPro/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Smart Cleaner Pro</string>
              <string name="app_title">Smart Cleaner Pro</string>
              <string name="subtitle">Your device, cleaner and simpler</string>
              <string name="storage_title">Storage overview</string>
              <string name="used">Used</string>
              <string name="free">Available</string>
              <string name="total">Total</string>
              <string name="quick_actions">Quick actions</string>
              <string name="large_files">Large files</string>
              <string name="duplicates">Duplicate files</string>
              <string name="device_info">Device information</string>
              <string name="settings">Appearance &amp; language</string>
              <string name="dark_mode">Dark theme</string>
              <string name="language">Language</string>
              <string name="english">English</string>
              <string name="persian">فارسی</string>
              <string name="scan">Scan storage</string>
              <string name="scan_note">File scanning will be added in the next milestone. No files are deleted by this version.</string>
              <string name="storage_note">Storage values are provided by Android and may include system-reserved space.</string>
              <string name="gb">GB</string>
          </resources>
          EOF
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: extracted/AndroidSmartCleanerPro
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Smart-Cleaner-Pro-APK
          path: extracted/AndroidSmartCleanerPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
