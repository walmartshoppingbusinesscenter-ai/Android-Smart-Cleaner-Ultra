
name: Build Android Smart Cleaner Pro APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o AndroidSmartCleanerPro-MVP.zip -d extracted
          test -f extracted/AndroidSmartCleanerPro/settings.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: extracted/AndroidSmartCleanerPro
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Smart-Cleaner-Pro-APK
          path: extracted/AndroidSmartCleanerPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
